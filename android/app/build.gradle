plugins { id 'com.android.application' }

android {
    namespace 'org.vietnom.app'
    compileSdk 35
    defaultConfig {
        applicationId 'org.vietnom.app'
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName '1.0.11'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    androidResources { noCompress 'onnx', 'json', 'txt', 'dat' }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.4.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
}

